<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SAP UI5 OData Metadata Manager — manage, compare and snapshot OData service metadata versions."
    />
    <title>OData Metadata Manager | SAP Fiori</title>

    <!-- SAP UI5 Core from CDN (patch-level independent URL) -->
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-libs="sap.m,sap.ui.layout,sap.ui.core,sap.f"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-async="true"
      data-sap-ui-preload="off"
      data-sap-ui-resourceroots='{"odata.metadata.manager": "./"}'
      data-sap-ui-frameOptions="trusted"
    ></script>

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="css/style.css" />

    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ui.require(
          ["sap/m/Shell", "sap/ui/core/ComponentContainer"],
          function (Shell, ComponentContainer) {
            new Shell({
              app: new ComponentContainer({
                height: "100%",
                name: "odata.metadata.manager",
                settings: { id: "odata.metadata.manager" },
                manifest: true,
              }),
            }).placeAt("content");
          },
        );
      });
    </script>
  </head>
  <body class="sapUiBody">
    <div id="content" style="height: 100%; width: 100%"></div>
  </body>
</html>
